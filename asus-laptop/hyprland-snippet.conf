# Add to ~/.config/hypr/hyprland.conf

# Start menu: Rofi instead of wofi (replaces the existing $menu line).
# SUPER+R from the default config keeps working.
$menu = rofi -show drun

# Extra: SUPER+Space toggles the start menu (closes it if already open)
bind = SUPER, SPACE, exec, pkill rofi || rofi -show drun

# Normal mouse pointer (Adwaita) instead of the X cursor
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Adwaita 24

# Only if the pointer is invisible or glitchy in a VM (Parallels):
# cursor {
#     no_hardware_cursors = true
# }
